[project]
name = "prmeval"
version = "0.1.0"
description = "Extensible remote evaluation framework for robot reward models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PRMEval contributors" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "datasets>=3.0",
    "pillow>=9.0",
    "imageio>=2.37",
    "av>=12.0",
]

[project.scripts]
prmeval-eval = "prmeval.cli:main"
prmeval-data-preprocess = "prmeval.data.prepare:main"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prmeval*"]
namespaces = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
