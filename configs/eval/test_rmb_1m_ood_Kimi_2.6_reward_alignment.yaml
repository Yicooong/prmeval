sampling:
  dataset_name: rbm_1m_ood_test
  adapter: huggingface
  paths: [/mnt/xxx/rbm-1m-ood]
  max_trajectories: 10
  eval_types: [reward_alignment]
  max_frames: 8
  pad_frames: false
  progress_type: absolute_first_frame

baseline:
  name: progress_test
  transport: openai_chat
  base_url: BASE_URL
  api_key: OPENAI_API_KEY
  model_id: MODEL_ID
  timeout_seconds: 120
  max_retries: 0
  max_concurrency: 1
  temperature: 0
  max_tokens: 12800
  options: {}

metrics: [reward_alignment]
output_dir: evaluation_output
run_name: test_rbm_1m_ood
resume: false
