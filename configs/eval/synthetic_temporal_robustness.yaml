sampling:
  dataset_name: rbm_1m_ood
  adapter: huggingface 
  paths: [/mnt/shared-storage-gpfs2/xxxxx/hf_rbm_1m_ood_datasets/rbm-1m-ood]
  # max_trajectories: 1
  eval_types: [synthetic_temporal_robustness]
  base_frames: 5
  progress_type: absolute_first_frame
  random_seed: 42
  temporal_robustness:
    max_frames: 8
    min_length_ratio: 0.7
    max_length_ratio: 1.7
    transforms: [pause, slow, fast, rewind, retry, truncate, skip]
    variants_per_transform: 3

infer:
  name: robometer
  model_path: robometer/Robometer-4B
  model_id: robometer/Robometer-4B
  batch_size: 8
  options:
    max_new_tokens: 128

metrics: [synthetic_temporal_robustness]
output_dir: evaluation_output
run_name: synthetic-temporal-robustness
resume: false
