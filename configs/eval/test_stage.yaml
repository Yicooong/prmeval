sampling:
  dataset_name: jsonl-full-smoke
  paths: [examples/stage_1_smoke/trajectories.jsonl]
  max_trajectories: 1
  base_frames: 3
  progress_type: absolute_first_frame

infer:
  name: openai_compatible
  base_url: null  # 从环境变量 BASE_URL 读取
