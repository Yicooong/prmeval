sampling:
  dataset_name: eval_dataset
  paths: [/path/to/local/hf_dataset]
  max_trajectories: 1
  eval_types: [progress]
  base_frames: 8
  progress_type: absolute_first_frame

infer:
  name: progress_test
  base_url: BASE_URL
  api_key: OPENAI_API_KEY
  model_id: MODEL_ID
  timeout_seconds: 120
  max_retries: 2
  temperature: 0
  max_tokens: 1024
  batch_size: 1
  options: {}

metrics: [progress]
mode: separate
output_dir: evaluation_output
run_name: progress-test-remote
resume: false
