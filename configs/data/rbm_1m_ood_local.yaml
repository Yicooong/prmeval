# Paths point to Hugging Face dataset repositories downloaded by the user.
output_dir: /path/to/prmeval/processed_datasets
max_frames: 32

sources:
  - dataset_id: ykorkmaz/usc_trossen_rfm
    path: /path/to/downloads/usc_trossen_rfm
    subset: usc_trossen
    cache_name: ykorkmaz_usc_trossen_rfm_usc_trossen

  - dataset_id: jesbu1/rfm_new_mit_franka_rfm
    path: /path/to/downloads/rfm_new_mit_franka_rfm
    subset: rfm_new_mit_franka_rfm
    cache_name: jesbu1_rfm_new_mit_franka_rfm_rfm_new_mit_franka_rfm

  - dataset_id: jesbu1/utd_so101_clean_policy_ranking_top
    path: /path/to/downloads/utd_so101_clean_policy_ranking_top
    subset: utd_so101_clean_policy_ranking_top
    cache_name: jesbu1_utd_so101_clean_policy_ranking_top_utd_so101_clean_policy_ranking_top

  - dataset_id: aliangdw/usc_xarm_policy_ranking
    path: /path/to/downloads/usc_xarm_policy_ranking
    subset: usc_xarm_policy_ranking
    cache_name: aliangdw_usc_xarm_policy_ranking_usc_xarm_policy_ranking

  - dataset_id: aliangdw/usc_franka_policy_ranking
    path: /path/to/downloads/usc_franka_policy_ranking
    subset: usc_franka_policy_ranking
    cache_name: aliangdw_usc_franka_policy_ranking_usc_franka_policy_ranking

  - dataset_id: jesbu1/usc_koch_p_ranking_rfm
    path: /path/to/downloads/usc_koch_p_ranking_rfm
    subset: usc_koch_p_ranking_all
    cache_name: jesbu1_usc_koch_p_ranking_rfm_usc_koch_p_ranking_all
